

stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy

build:       # This job runs in the build stage, which runs first.
  stage: build
  image: debian:unstable
  before_script:
    - apt update
    - apt full-upgrade -y
    - apt install -y golang hugo
  script:
    - hugo env
    - hugo
  artifacts:
    untracked: true

deploy:
  stage: deploy
  image: debian
  dependencies:
    - build
  before_script:
    - apt update
    - apt full-upgrade -y
    - apt install -y openssh-client rsync
    # https://docs.gitlab.com/ee/ci/jobs/ssh_keys.html
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )' 
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
  script:
    - ls public
    - rsync -avh public/ gitlab@ts-gw:/var/www/blog/



